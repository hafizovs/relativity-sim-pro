<div class="experiment">
  <button
    type="button"
    class="experiment__btn experiment__btn--fwd"
    [disabled]="full()"
    (click)="fireForward()"
  >
    {{ t('experiment.laserForward') }}
  </button>
  <button
    type="button"
    class="experiment__btn experiment__btn--back"
    [disabled]="full()"
    (click)="fireBackward()"
  >
    {{ t('experiment.laserBackward') }}
  </button>
  <span class="experiment__count">{{ t('experiment.active') }}: {{ count() }}</span>
  <p class="experiment__hint">{{ t('experiment.hint') }}</p>
</div>
